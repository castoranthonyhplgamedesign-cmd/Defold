<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <title>Coin Sort</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #bg-container,
      #game-root {
        position: fixed;
        inset: 0;
      }

      #game-root {
        z-index: 1;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="bg-container"></div>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
